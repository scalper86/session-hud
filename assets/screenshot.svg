<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-label="session-hud 화면 예시: 프롬프트 위 사용량 띠, 오른쪽 변경 파일 패널, 오른쪽 위 알림">
  <style>
    text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif; font-size: 14px; fill: #e6e6e6; }
    .mono { font-family: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; }
    .dim { fill: #8b8b8b; }
    .b { font-weight: 700; }
    .ok { fill: #4ec96b; }
    .warn { fill: #e5c07b; }
    .bad { fill: #e06c75; }
    .small { font-size: 12px; }
  </style>

  <!-- 창 -->
  <rect width="1100" height="460" rx="12" fill="#1b1b1d"/>
  <rect x="0.5" y="0.5" width="1099" height="459" rx="12" fill="none" stroke="#333"/>
  <circle cx="22" cy="20" r="6" fill="#e06c75"/>
  <circle cx="42" cy="20" r="6" fill="#e5c07b"/>
  <circle cx="62" cy="20" r="6" fill="#4ec96b"/>
  <text x="550" y="25" text-anchor="middle" class="dim small">Claude Code</text>
  <line x1="0" y1="40" x2="1100" y2="40" stroke="#2c2c2e"/>

  <!-- 대화 -->
  <text x="32" y="80" class="dim">&gt; API 클라이언트에 재시도 로직을 넣고 헤더를 정리해 줘</text>
  <text x="32" y="118">재시도 로직을 추가하고 헤더 컴포넌트를 정리했습니다.</text>
  <text x="32" y="148" class="dim">● Edit  src/api/client.ts</text>
  <text x="32" y="174" class="dim">● Edit  src/components/Header.tsx</text>
  <text x="32" y="200" class="dim">● Write tests/client.test.ts</text>
  <text x="32" y="238">테스트를 추가했고 모두 통과합니다.</text>

  <!-- 알림 -->
  <rect x="452" y="56" width="268" height="54" rx="8" fill="#2a2a2d" stroke="#45454a"/>
  <text x="468" y="78" class="dim small">session-hud</text>
  <text x="468" y="98" class="small">7일 한도 83% 사용 · 2일 뒤 초기화</text>

  <g transform="translate(0,-100)">
  <!-- 사용량 띠 -->
  <line x1="24" y1="402" x2="730" y2="402" stroke="#2c2c2e"/>
  <rect x="24" y="416" width="58" height="24" rx="3" fill="#e6e6e6"/>
  <text x="53" y="433" text-anchor="middle" class="b" style="fill:#1b1b1d">사용량</text>

  <text x="100" y="433" class="b">컨텍스트</text>
  <rect x="164" y="423" width="80" height="12" rx="2" fill="#333"/>
  <rect x="164" y="423" width="48" height="12" rx="2" fill="#4ec96b"/>
  <text x="252" y="433" class="b ok mono">62%</text>

  <text x="312" y="433" class="b">5시간</text>
  <rect x="356" y="423" width="80" height="12" rx="2" fill="#333"/>
  <rect x="356" y="423" width="32" height="12" rx="2" fill="#4ec96b"/>
  <text x="444" y="433" class="b ok mono">42%</text>
  <text x="484" y="433" class="dim">3시간 12분 뒤 초기화</text>

  <text x="100" y="465" class="b">7일</text>
  <rect x="132" y="455" width="80" height="12" rx="2" fill="#333"/>
  <rect x="132" y="455" width="64" height="12" rx="2" fill="#e5c07b"/>
  <text x="220" y="465" class="b warn mono">83%</text>
  <text x="260" y="465" class="dim">2일 뒤 초기화</text>

  <text x="372" y="465" class="b warn mono">$3.42</text>
  <text x="420" y="465" class="dim mono">/ $5.00</text>

  <text x="500" y="465" class="b">변경 3개</text>
  <text x="566" y="465" class="ok mono">+58</text>
  <text x="600" y="465" class="bad mono">−12</text>

  <!-- 프롬프트 -->
  <rect x="24" y="486" width="706" height="46" rx="8" fill="none" stroke="#4a4a4f"/>
  <text x="42" y="514" class="dim">&gt; 메시지를 입력하세요</text>

  </g>

  <!-- 변경 파일 패널 -->
  <path d="M750 40 H1100 V448 A12 12 0 0 1 1088 460 H750 Z" fill="#202023"/>
  <line x1="750" y1="40" x2="750" y2="460" stroke="#333"/>
  <text x="770" y="72" class="b">변경 파일</text>
  <line x1="750" y1="88" x2="1100" y2="88" stroke="#2c2c2e"/>

  <text x="770" y="118" class="b">파일 3개</text>
  <text x="840" y="118" class="b ok mono">+58</text>
  <text x="880" y="118" class="b bad mono">−12</text>
  <rect x="1008" y="101" width="72" height="26" rx="5" fill="none" stroke="#5a5a60"/>
  <text x="1044" y="119" text-anchor="middle" class="small">비우기</text>

  <text x="770" y="156" class="ok mono">+41</text>
  <text x="806" y="156" class="bad mono">−3</text>
  <text x="836" y="156">src/api/client.ts</text>

  <text x="770" y="184" class="ok mono">+15</text>
  <text x="806" y="184" class="bad mono">−9</text>
  <text x="836" y="184">src/components/Header.tsx</text>
  <text x="1040" y="184" class="dim">2회</text>

  <text x="770" y="212" class="ok mono">+2</text>
  <text x="806" y="212" class="bad mono">−0</text>
  <text x="836" y="212">tests/client.test.ts</text>
  <text x="1010" y="212" class="ok">새 파일</text>
</svg>
