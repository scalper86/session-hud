  <text x="1150" y="544" class="small dim">2회</text>

  <text x="784" y="570" text-anchor="end" class="small ok mono">+24</text>
  <text x="818" y="570" text-anchor="end" class="small bad mono" opacity="0.55">−0</text>
  <text x="830" y="570"><tspan class="dim">tests/</tspan>client.test.ts</text>
  <text x="1130" y="570" class="small ok">새 파일</text>
