<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-label="session-hud 화면 예시: 프롬프트 위 사용량 띠와 클리어 권장, 오른쪽 작업 패널(작업 요약, 다음 할 일 추천, 변경 파일), 오른쪽 위 알림">
  <style>
    text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif; font-size: 14px; fill: #e6e6e6; }
    .mono { font-family: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; }
    .dim { fill: #8b8b8b; }
    .b { font-weight: 700; }
    .sb { font-weight: 600; }
    .ok { fill: #4ec96b; }
    .warn { fill: #e5c07b; }
    .bad { fill: #e06c75; }
    .small { font-size: 12px; }
    .link { fill: #7aa2f7; }
  </style>

  <!-- 창 -->
  <rect width="1200" height="610" rx="12" fill="#1b1b1d"/>
  <rect x="0.5" y="0.5" width="1199" height="609" rx="12" fill="none" stroke="#333"/>
  <circle cx="22" cy="20" r="6" fill="#e06c75"/>
  <circle cx="42" cy="20" r="6" fill="#e5c07b"/>
  <circle cx="62" cy="20" r="6" fill="#4ec96b"/>
  <text x="600" y="25" text-anchor="middle" class="dim small">Claude Code</text>
  <line x1="0" y1="40" x2="1200" y2="40" stroke="#2c2c2e"/>

  <!-- 대화 -->
  <text x="32" y="80" class="dim">&gt; API 클라이언트에 재시도 로직을 넣고 헤더를 정리해 줘</text>
  <text x="32" y="118">재시도 로직을 추가하고 헤더 컴포넌트를 정리했습니다.</text>
  <text x="32" y="148" class="dim">● Edit  src/api/client.ts</text>
  <text x="32" y="174" class="dim">● Edit  src/components/Header.tsx</text>
  <text x="32" y="200" class="dim">● Write tests/client.test.ts</text>
  <text x="32" y="226" class="dim">● Bash  npm test</text>
  <text x="32" y="264">테스트를 추가했고 모두 통과합니다.</text>

