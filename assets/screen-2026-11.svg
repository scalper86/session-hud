  <text x="756" y="292" class="b dim">2</text>
  <text x="776" y="292">헤더 변경을 브라우저에서 확인해 줘</text>
  <text x="756" y="318" class="b dim">3</text>
  <text x="776" y="318">바뀐 내용을 커밋해 줘</text>

  <!-- 지난 작업 -->
  <text x="756" y="356" class="sb">지난 작업 1개</text>
  <text x="756" y="382" class="sb dim">#1</text>
  <text x="782" y="382">테스트는 어떻게 돌리는지 알려 줘</text>
  <text x="756" y="406" class="small sb ok">✓ 끝남 · 18초</text>
  <text x="846" y="406" class="small dim">읽기 2 · 검색 1</text>
  <text x="756" y="430" class="small dim">▸ 세부 단계 3개</text>

  <line x1="756" y1="452" x2="1180" y2="452" stroke="#3a3a3e"/>

  <!-- 변경 파일 -->
  <text x="756" y="484" class="sb">변경 파일</text>
  <text x="826" y="484" class="small dim mono">3개</text>
  <text x="860" y="484" class="small ok mono">+58</text>
  <text x="892" y="484" class="small bad mono">−12</text>
  <rect x="1116" y="467" width="64" height="26" rx="5" fill="none" stroke="#5a5a60"/>
  <text x="1148" y="485" text-anchor="middle" class="small">비우기</text>

  <text x="784" y="518" text-anchor="end" class="small ok mono">+19</text>
  <text x="818" y="518" text-anchor="end" class="small bad mono">−3</text>
  <text x="830" y="518"><tspan class="dim">src/api/</tspan>client.ts</text>

  <text x="784" y="544" text-anchor="end" class="small ok mono">+15</text>
